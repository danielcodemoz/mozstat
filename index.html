<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
(function () {
  try {
    var s = localStorage.getItem("dm-labs-theme");
    document.documentElement.setAttribute("data-theme", s === "dark" ? "dark" : "light");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
  try {
    var l = localStorage.getItem("dm-labs-lang");
    if (l === "en" || l === "pt") document.documentElement.lang = l;
  } catch (e) {}
})();
  </script>
  <title>MozStat · Daniel Marcos Labs</title>
  <meta name="description" content="Indicadores ao vivo de Moçambique (World Bank, REST Countries, Open-Meteo). Um laboratório de Daniel Marcos." />
  <style>
:root {
  --bg: #F7F8FA;
  --text: #0F172A;
  --muted: #64748B;
  --accent: #0F766E;
  --accent-hover: #0D9488;
  --accent-dim: rgba(15, 118, 110, 0.14);
  --card: #FFFFFF;
  --line: rgba(15, 23, 42, 0.10);
  --input: #FFFFFF;
  --shadow: 0 10px 32px rgba(15, 23, 42, 0.06);
  --ok: #15803D;
  --danger: #DC2626;
  --header-wash: rgba(15, 118, 110, 0.07);
  --board-empty: #F1F5F9;
  --on-accent: #fff;
}
html { color-scheme: light; }
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1220;
  --text: #E8EEF7;
  --muted: #9AA8BC;
  --accent: #D4AF37;
  --accent-hover: #E8C547;
  --accent-dim: rgba(212, 175, 55, 0.16);
  --card: #121A2B;
  --line: rgba(232, 238, 247, 0.08);
  --input: #0B1220;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  --ok: #6FCF97;
  --danger: #E26D7A;
  --header-wash: rgba(212, 175, 55, 0.06);
  --board-empty: #0E1628;
  --on-accent: #0B1220;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.site-header, .site-footer { padding: 1rem 1.25rem; }
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--header-wash), transparent);
  flex-wrap: wrap;
}
.brand { font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.01em; }
.brand:hover { color: var(--accent); text-decoration: none; }
.brand span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.lang-toggle {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
  background: var(--card);
}
.lang-toggle button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 0.35rem 0.65rem;
  font: 700 0.75rem/1 system-ui, sans-serif;
  letter-spacing: 0.04em;
  cursor: pointer;
}
.lang-toggle button[aria-pressed="true"] {
  background: var(--accent);
  color: #fff;
}
html[data-theme="dark"] .lang-toggle button[aria-pressed="true"] { color: #0B1220; }
.icon-btn {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 999px;
  width: 2.4rem;
  height: 2.4rem;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.gh-link {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.4rem 0.75rem;
}
.gh-link:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }
main { width: min(1080px, calc(100% - 2rem)); margin: 1.25rem auto 2rem; flex: 1; }
h1 { font-size: 1.55rem; margin: 0 0 0.35rem; letter-spacing: -0.02em; }
h2 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 1.4rem 0 0.7rem; }
.lead { color: var(--muted); margin: 0 0 1.1rem; line-height: 1.5; }
.btn {
  font: inherit;
  cursor: pointer;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  padding: 0.55rem 0.95rem;
}
.btn:hover { border-color: var(--accent); }
.btn-accent {
  background: var(--accent);
  color: var(--on-accent);
  border-color: transparent;
  font-weight: 600;
}
.btn-accent:hover { filter: brightness(1.06); }
.btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; font-weight: 650; }
.site-footer {
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.88rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 0.85rem;
}
.muted { color: var(--muted); }
.ok { color: var(--ok); }
.danger { color: var(--danger); }
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.85rem; }
.banner {
  padding: 0.65rem 0.8rem;
  border-radius: 10px;
  margin-bottom: 0.85rem;
  border: 1px solid var(--line);
  font-size: 0.92rem;
}
.banner.err { border-color: var(--danger); color: var(--danger); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.75rem;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1rem 1.05rem 0.95rem;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  min-height: 9.2rem;
}
.kpi-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  font-weight: 700;
  margin: 0 0 0.45rem;
}
.kpi-value {
  font-size: 1.7rem;
  font-weight: 750;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 0 0 auto;
  word-break: break-word;
}
.kpi-value.small { font-size: 1.15rem; }
.kpi-meta {
  margin: 0.7rem 0 0;
  font-size: 0.78rem;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 0.55rem;
  align-items: center;
}
.kpi-meta time { font-variant-numeric: tabular-nums; }
.flag {
  width: 100%;
  max-width: 220px;
  border-radius: 8px;
  border: 1px solid var(--line);
  display: block;
}
.skel {
  border-radius: 8px;
  background: linear-gradient(90deg, var(--line), transparent, var(--line));
  background-size: 200% 100%;
  animation: pulse 1.2s ease-in-out infinite;
}
.skel-label { height: 0.7rem; width: 42%; margin-bottom: 0.7rem; }
.skel-value { height: 1.7rem; width: 68%; margin-bottom: auto; }
.skel-meta { height: 0.7rem; width: 55%; margin-top: 0.8rem; }
@keyframes pulse { 50% { opacity: 0.45; } }
.sources {
  font-size: 0.88rem;
  color: var(--muted);
  line-height: 1.55;
  margin-top: 1.4rem;
}
.sources ul { margin: 0.4rem 0 0; padding-left: 1.15rem; }
.sources li { margin: 0.2rem 0; }
@media (max-width: 640px) {
  .site-header { align-items: flex-start; }
  .kpi-value { font-size: 1.45rem; }
}
  </style>
</head>

      <div class="lang-toggle" role="group" aria-label="Language">

  <script>
(function () {
  var KEY = "dm-labs-theme";
  var btn = document.getElementById("theme-toggle");
  var SUN = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>';
  function isDark() { return document.documentElement.getAttribute("data-theme") === "dark"; }
  function paint() {
    if (!btn) return;
    btn.innerHTML = isDark() ? SUN : MOON;
    var en = (document.documentElement.lang || "pt") === "en";
    btn.setAttribute("aria-label", isDark() ? (en ? "Light mode" : "Modo claro") : (en ? "Dark mode" : "Modo escuro"));
  }
  window.__dmPaintTheme = paint;
  paint();
  if (btn) btn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    paint();
  });
})();

function dmGetLang() {
  try {
    var l = localStorage.getItem("dm-labs-lang");
    if (l === "en" || l === "pt") return l;
  } catch (e) {}
  return "pt";
}
function dmSetLang(l) {
  try { localStorage.setItem("dm-labs-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.querySelectorAll(".lang-toggle button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true" : "false");
  });
  var dict = (window.I18N && window.I18N[l]) || {};
  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    var k = el.getAttribute("data-i18n");
    if (dict[k] != null) el.textContent = dict[k];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
    var k = el.getAttribute("data-i18n-html");
    if (dict[k] != null) el.innerHTML = dict[k];
  });
  if (window.__dmPaintTheme) window.__dmPaintTheme();
  if (window.onLangChange) window.onLangChange(l);
}
document.querySelectorAll(".lang-toggle button").forEach(function (b) {
  b.addEventListener("click", function () { dmSetLang(b.getAttribute("data-lang")); });
});

(function () {

    { id: "maputo", lat: -25.9658, lon: 32.5832 },
    { id: "beira", lat: -19.8333, lon: 34.8500 },
    { id: "nampula", lat: -15.1167, lon: 39.2667 },

  var WB_LINK = {

  function t(k) {
    var l = dmGetLang();
    return (I18N[l] && I18N[l][k]) || I18N.pt[k] || k;
  }
  function locale() { return dmGetLang() === "en" ? "en-GB" : "pt-MZ"; }
  function num(n, maxFrac) {
    if (n == null || !isFinite(n)) return null;
    return new Intl.NumberFormat(locale(), { maximumFractionDigits: maxFrac || 0 }).format(n);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function weatherText(code) {
    var map = {0:"w0",1:"w1",2:"w2",3:"w3",45:"w45",48:"w48",51:"w51",53:"w51",55:"w51",61:"w61",63:"w63",65:"w65",71:"w71",80:"w80",81:"w80",82:"w80",95:"w95",96:"w95",99:"w95"};

  function wbLatest(json) {
    var rows = null;
    var updated = null;
    if (Array.isArray(json)) {
      if (json[0] && json[0].lastupdated) updated = json[0].lastupdated;
      rows = json[1];
    } else if (json && Array.isArray(json.data)) rows = json.data;
    if (!rows || !rows.length) return null;
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (!row || row.value == null || row.value === "") continue;
      var v = Number(row.value);
      if (isFinite(v)) return { value: v, date: row.date, updated: updated };
    }
    return null;
  }
  function parseRc(j) {
    if (!j) throw new Error("rc empty");
    if (j.success === false) throw new Error("rc deprecated");
    if (j.errors && j.data == null && !j.cca3 && !j.alpha3Code) throw new Error("rc deprecated");
    var row = Array.isArray(j) ? j[0] : (j.data && j.data.objects && j.data.objects[0]) || j;

    var name = row.name;
    var hasName = typeof name === "string" ? name : (name && (name.common || name.official));
    if (!hasName && !row.cca3 && !row.alpha3Code) throw new Error("rc shape");
    return row;
  }

    var langs = {};
    if (row.languages && !Array.isArray(row.languages)) langs = row.languages;

        if (!l) return;

        else langs[l.iso639_2 || l.iso639_1 || l.name] = l.name || l.nativeName || "";
      });
    }
    var curs = {};
    if (row.currencies && !Array.isArray(row.currencies)) curs = row.currencies;
    else if (Array.isArray(row.currencies)) {
      row.currencies.forEach(function (c) {
        if (!c) return;
        curs[c.code || c.name] = { name: c.name, symbol: c.symbol };
      });
    }
    var capital = row.capital;
    if (typeof capital === "string") capital = [capital];
    if (!Array.isArray(capital)) capital = [];
    var flags = row.flags || {};
    return {
      capital: capital,
      area: row.area,
      languages: langs,
      currencies: curs,
      flags: flags
    };
  }
  function fetchJson(url, timeoutMs) {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, timeoutMs || 12000);
    var opts = { method: "GET", mode: "cors" };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);

    ];

    }, Promise.reject(new Error("start")));
  }

  var slots = {
    pop: { loading: true, data: null, error: false },

    life: { loading: true, data: null, error: false },
    area: { loading: true, data: null, error: false },

  });

  function setSlot(id, patch) {
    slots[id] = Object.assign({}, slots[id], patch);
  }

  function sourceLink(href, label) {
    return '<a href="' + esc(href) + '" rel="noopener" target="_blank">' + esc(label) + "</a>";
  }
  function retryBtn(id) {
    return '<button type="button" class="btn btn-sm" data-retry="' + esc(id) + '">' + esc(t("retry")) + "</button>";
  }
  function kpiSkeleton() {
    return '<article class="kpi" aria-busy="true"><div class="skel skel-label"></div><div class="skel skel-value"></div><div class="skel skel-meta"></div></article>';
  }
  function kpiCard(opts) {
    var loading = opts.loading;
    var failed = opts.error || (!loading && (opts.valueHtml == null || opts.valueHtml === ""));
    if (loading) return kpiSkeleton();
    if (failed) {
      return '<article class="kpi">' +
        '<p class="kpi-label">' + esc(opts.label) + "</p>" +
        '<p class="kpi-value muted">—</p>' +
        '<p class="kpi-meta danger">' + esc(t("cardFail")) + "</p>" +
        '<p class="kpi-meta">' + retryBtn(opts.retryId) + "</p>" +
        "</article>";
    }
    var meta = [];
    if (opts.sourceHtml) meta.push(opts.sourceHtml);
    if (opts.time) {
      var label = opts.timeLabel || opts.time;
      meta.push("<time datetime=\"" + esc(opts.time) + "\">" + esc(t("updated") + " " + label) + "</time>");
    }
    if (opts.extra) meta.push("<span>" + opts.extra + "</span>");
    return '<article class="kpi">' +
      '<p class="kpi-label">' + esc(opts.label) + "</p>" +
      '<p class="kpi-value' + (opts.small ? " small" : "") + '">' + opts.valueHtml + "</p>" +
      (meta.length ? '<p class="kpi-meta">' + meta.join("") + "</p>" : "") +
      "</article>";
  }

  function render() {
    var banners = document.getElementById("banners");
    var ids = Object.keys(slots);
    var loadingN = ids.filter(function (k) { return slots[k].loading; }).length;
    var errN = ids.filter(function (k) { return slots[k].error; }).length;
    var okN = ids.filter(function (k) { return !slots[k].loading && !slots[k].error && slots[k].data; }).length;
    if (loadingN) banners.innerHTML = '<div class="banner">' + esc(t("loading")) + "</div>";
    else if (errN && !okN) banners.innerHTML = '<div class="banner err">' + esc(t("error")) + "</div>";
    else if (errN) banners.innerHTML = '<div class="banner err">' + esc(t("error")) + "</div>";
    else banners.innerHTML = "";

    var rc = slots.rc.data;
    var pop = slots.pop.data;
    var gdp = slots.gdp.data;
    var life = slots.life.data;
    var areaWb = slots.area.data;
    var capitalWb = slots.capital.data;

    var popV = pop ? num(pop.value) : null;
    var gdpV = null;
    if (gdp) gdpV = esc(num(gdp.value / 1e9, 1) + " " + t("billion") + " " + t("usd"));
    var lifeV = life ? esc(num(life.value, 1) + " " + t("years")) : null;

    var cap = null;
    if (rc && rc.capital && rc.capital[0]) cap = esc(rc.capital[0]);
    else if (capitalWb) cap = esc(capitalWb);

    var areaV = null;
    var areaSrc = null;
    var areaTime = null;
    var areaTimeLabel = null;
    if (rc && rc.area != null && isFinite(Number(rc.area))) {
      areaV = esc(num(Number(rc.area)) + " " + t("km2"));
      areaSrc = sourceLink(RC_LINK, t("sourceRC"));
    } else if (areaWb) {
      areaV = esc(num(areaWb.value) + " " + t("km2"));
      areaSrc = sourceLink(WB_LINK.area, t("sourceWB"));
      areaTime = areaWb.updated || areaWb.date;
      areaTimeLabel = areaWb.date || areaWb.updated;
    }

    var langs = null;
    if (rc && rc.languages && Object.keys(rc.languages).length) {
      langs = esc(Object.values(rc.languages).filter(Boolean).join(", "));
    }
    var cur = null;
    if (rc && rc.currencies && Object.keys(rc.currencies).length) {
      cur = esc(Object.keys(rc.currencies).map(function (c) {
        var x = rc.currencies[c];
        return (x && x.symbol ? x.symbol + " " : "") + ((x && x.name) || c) + " (" + c + ")";
      }).join(", "));
    }
    var flagHtml = null;
    if (rc && rc.flags && (rc.flags.svg || rc.flags.png)) {
      flagHtml = '<img class="flag" alt="' + esc(t("flag")) + '" src="' + esc(rc.flags.svg || rc.flags.png) + '" />';
    }

    var country = "";
    country += kpiCard({
      loading: slots.pop.loading, error: slots.pop.error, retryId: "pop",
      label: t("pop"), valueHtml: popV ? esc(popV) : null,
      sourceHtml: sourceLink(WB_LINK.pop, t("sourceWB")),
      time: pop && (pop.updated || pop.date),
      timeLabel: pop && (pop.date || pop.updated)
    });
    var capLoading = !cap && (slots.rc.loading || slots.capital.loading);
    var capFromRc = rc && rc.capital && rc.capital[0];
    country += kpiCard({
      loading: capLoading,
      error: !cap && !slots.rc.loading && !slots.capital.loading,
      retryId: "capital",
      label: t("capital"),
      valueHtml: cap,
      sourceHtml: capFromRc ? sourceLink(RC_LINK, t("sourceRC")) : sourceLink(WB_LINK.country, t("sourceWB"))
    });
    var areaLoading = !areaV && (slots.rc.loading || slots.area.loading);
    country += kpiCard({
      loading: areaLoading,
      error: !areaV && !slots.rc.loading && !slots.area.loading,
      retryId: "area",
      label: t("area"),
      valueHtml: areaV,
      sourceHtml: areaSrc,
      time: areaTime,
      timeLabel: areaTimeLabel
    });
    country += kpiCard({
      loading: slots.gdp.loading, error: slots.gdp.error, retryId: "gdp",
      label: t("gdp"), valueHtml: gdpV,
      sourceHtml: sourceLink(WB_LINK.gdp, t("sourceWB")),
      time: gdp && (gdp.updated || gdp.date),
      timeLabel: gdp && (gdp.date || gdp.updated)
    });
    country += kpiCard({
      loading: slots.life.loading, error: slots.life.error, retryId: "life",
      label: t("life"), valueHtml: lifeV,
      sourceHtml: sourceLink(WB_LINK.life, t("sourceWB")),
      time: life && (life.updated || life.date),
      timeLabel: life && (life.date || life.updated)
    });
    if (slots.rc.loading || langs || slots.rc.error) {
      country += kpiCard({
        loading: slots.rc.loading, error: slots.rc.error && !langs, retryId: "rc",
        label: t("languages"), valueHtml: langs, small: true,
        sourceHtml: sourceLink(RC_LINK, t("sourceRC"))
      });
    }
    if (slots.rc.loading || cur || slots.rc.error) {
      country += kpiCard({
        loading: slots.rc.loading, error: slots.rc.error && !cur, retryId: "rc",
        label: t("currency"), valueHtml: cur, small: true,
        sourceHtml: sourceLink(RC_LINK, t("sourceRC"))
      });
    }
    if (slots.rc.loading || flagHtml || slots.rc.error) {
      country += kpiCard({
        loading: slots.rc.loading, error: slots.rc.error && !flagHtml, retryId: "rc",
        label: t("flag"), valueHtml: flagHtml,
        sourceHtml: sourceLink(RC_LINK, t("sourceRC"))
      });
    }
    document.getElementById("grid-country").innerHTML = country;

    var wxHtml = "";
    CITIES.forEach(function (c) {
      var id = "wx-" + c.id;
      var slot = slots[id];
      var value = null;
      var extra = null;
      var time = null;
      var timeLabel = null;
      if (slot.data && slot.data.current) {
        var curw = slot.data.current;
        value = esc(num(curw.temperature_2m, 1) + " °C");
        extra = esc(weatherText(curw.weather_code) + " · " + t("humidity") + " " + curw.relative_humidity_2m + "% · " + t("wind") + " " + num(curw.wind_speed_10m, 0) + " km/h");
        if (curw.time) {
          time = curw.time;
          try {
            timeLabel = new Date(curw.time).toLocaleString(locale(), { timeZone: "Africa/Maputo", hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short" });
          } catch (e) { timeLabel = curw.time; }
        }
      }
      wxHtml += kpiCard({
        loading: slot.loading, error: slot.error, retryId: id,
        label: t(c.id),
        valueHtml: value,
        sourceHtml: sourceLink(OM_LINK, t("sourceOM")),
        time: time,
        timeLabel: timeLabel,
        extra: extra
      });
    });
    document.getElementById("grid-weather").innerHTML = wxHtml;
  }

  function loadWb(code, slotId) {
    setSlot(slotId, { loading: true, error: false, data: null });
    render();
    var urls = [
      "https://api.worldbank.org/v2/country/MOZ/indicator/" + code + "?format=json&mrnev=1&per_page=8",
      "https://api.worldbank.org/v2/country/MOZ/indicator/" + code + "?format=json&per_page=20"
    ];
    return urls.reduce(function (p, u) {
      return p.catch(function () {
        return fetchJson(u).then(wbLatest).then(function (row) {
          if (!row) throw new Error("wb empty");
          return row;
        });
      });
    }, Promise.reject(new Error("start"))).then(function (row) {
      setSlot(slotId, { loading: false, error: false, data: row });
    }).catch(function () {
      setSlot(slotId, { loading: false, error: true, data: null });
    }).then(render);
  }

  function loadCapital() {
    setSlot("capital", { loading: true, error: false, data: null });
    render();
    return fetchJsonFirst(corsFallbacks("https://api.worldbank.org/v2/country/MOZ?format=json")).then(function (j) {
      var row = Array.isArray(j) ? j[1] && j[1][0] : null;
      var cap = row && row.capitalCity;
      if (!cap) throw new Error("no capital");
      setSlot("capital", { loading: false, error: false, data: cap });
    }).catch(function () {
      setSlot("capital", { loading: false, error: true, data: null });
    }).then(render);
  }

  function loadRc() {
    setSlot("rc", { loading: true, error: false, data: null });
    render();
    var urls = corsFallbacks("https://restcountries.com/v3.1/alpha/MOZ").concat(
      corsFallbacks("https://restcountries.com/v3.1/name/mozambique?fullText=true")
    );
    return fetchJsonFirst(urls).then(function (j) {
      var row = parseRc(j);
      var norm = normalizeRc(row);
      if (!norm) throw new Error("rc empty");
      setSlot("rc", { loading: false, error: false, data: norm });
    }).catch(function () {
      setSlot("rc", { loading: false, error: true, data: null });
    }).then(render);
  }

  function loadWx(city) {
    var id = "wx-" + city.id;
    setSlot(id, { loading: true, error: false, data: null });
    render();
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat +
      "&longitude=" + city.lon +
      "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Africa%2FMaputo";
    return fetchJson(url, 12000).then(function (j) {
      if (!j || !j.current) throw new Error("wx shape");
      setSlot(id, { loading: false, error: false, data: j });
    }).catch(function () {
      setSlot(id, { loading: false, error: true, data: null });
    }).then(render);
  }

  function loadAll() {
    loadWb("SP.POP.TOTL", "pop");
    loadWb("NY.GDP.MKTP.CD", "gdp");
    loadWb("SP.DYN.LE00.IN", "life");
    loadWb("AG.SRF.TOTL.K2", "area");
    loadCapital();
    loadRc();
    CITIES.forEach(loadWx);
  }

  function retry(id) {
    if (id === "pop") return loadWb("SP.POP.TOTL", "pop");
    if (id === "gdp") return loadWb("NY.GDP.MKTP.CD", "gdp");
    if (id === "life") return loadWb("SP.DYN.LE00.IN", "life");
    if (id === "area") return Promise.all([loadWb("AG.SRF.TOTL.K2", "area"), loadRc()]);
    if (id === "capital") return Promise.all([loadCapital(), loadRc()]);
    if (id === "rc") return loadRc();
    if (id.indexOf("wx-") === 0) {
      var cityId = id.slice(3);
      var city = CITIES.filter(function (c) { return c.id === cityId; })[0];
      if (city) return loadWx(city);
    }
  }

  document.getElementById("grid-country").addEventListener("click", function (e) {
    var b = e.target.closest("[data-retry]");
    if (b) retry(b.getAttribute("data-retry"));
  });
  document.getElementById("grid-weather").addEventListener("click", function (e) {
    var b = e.target.closest("[data-retry]");
    if (b) retry(b.getAttribute("data-retry"));
  });
  window.onLangChange = function () { render(); };
  document.getElementById("reload").addEventListener("click", loadAll);
  loadAll();
})();
    dmSetLang(dmGetLang());
  </script>
</body>
