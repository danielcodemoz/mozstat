  <script>
(function () {
  try {
    var s = localStorage.getItem("dm-labs-theme");
    document.documentElement.setAttribute("data-theme", s === "dark" ? "dark" : "light");
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
  try {
    var l = localStorage.getItem("dm-labs-lang");
    if (l === "en" || l === "pt") document.documentElement.lang = l;
  } catch (e) {}
})();

  <style>
:root {
  --bg: #F7F8FA;
  --text: #0F172A;
  --muted: #64748B;
  --accent: #0F766E;
  --accent-hover: #0D9488;
  --accent-dim: rgba(15, 118, 110, 0.14);
  --card: #FFFFFF;
  --line: rgba(15, 23, 42, 0.10);
  --input: #FFFFFF;
  --shadow: 0 10px 32px rgba(15, 23, 42, 0.06);
  --ok: #15803D;
  --danger: #DC2626;
  --header-wash: rgba(15, 118, 110, 0.07);
  --board-empty: #F1F5F9;
}
html { color-scheme: light; }
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1220;
  --text: #E8EEF7;
  --muted: #9AA8BC;
  --accent: #D4AF37;
  --accent-hover: #E8C547;
  --accent-dim: rgba(212, 175, 55, 0.16);
  --card: #121A2B;
  --line: rgba(232, 238, 247, 0.08);
  --input: #0B1220;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  --ok: #6FCF97;
  --danger: #E26D7A;
  --header-wash: rgba(212, 175, 55, 0.06);
  --board-empty: #0E1628;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.site-header, .site-footer { padding: 1rem 1.25rem; }
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--header-wash), transparent);
  flex-wrap: wrap;
}
.brand { font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.01em; }
.brand:hover { color: var(--accent); text-decoration: none; }
.brand span { color: var(--accent); }
.header-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.lang-toggle {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
  background: var(--card);
}
.lang-toggle button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 0.35rem 0.65rem;
  font: 700 0.75rem/1 system-ui, sans-serif;
  letter-spacing: 0.04em;
  cursor: pointer;
}
.lang-toggle button[aria-pressed="true"] {
  background: var(--accent);
  color: #fff;
}
html[data-theme="dark"] .lang-toggle button[aria-pressed="true"] { color: #0B1220; }
.icon-btn {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 999px;
  width: 2.4rem;
  height: 2.4rem;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.gh-link {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.4rem 0.75rem;
}
.gh-link:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }
main { width: min(960px, calc(100% - 2rem)); margin: 1.25rem auto 2rem; flex: 1; }
h1 { font-size: 1.55rem; margin: 0 0 0.35rem; letter-spacing: -0.02em; }
.lead { color: var(--muted); margin: 0 0 1.1rem; line-height: 1.5; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1rem 1.1rem;
  margin-bottom: 0.85rem;
  box-shadow: var(--shadow);
}
.btn {
  font: inherit;
  cursor: pointer;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  padding: 0.55rem 0.95rem;
}
.btn:hover { border-color: var(--accent); }
.btn-accent {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
  font-weight: 600;
}
.btn-accent:hover { filter: brightness(1.06); }
html[data-theme="dark"] .btn-accent { color: #0B1220; }
.btn-ghost { background: transparent; color: var(--text); }
.btn[aria-pressed="true"] {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.site-footer {
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.88rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 0.85rem;
}
.muted { color: var(--muted); }
.ok { color: var(--ok); }
.danger { color: var(--danger); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
input, select, textarea {
  font: inherit;
  background: var(--input);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.55rem 0.75rem;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
  outline: none;
}
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
@media (max-width: 640px) {
  .site-header { align-items: flex-start; }
}


    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
    }
    .stat .k {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .stat .v { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    .stat .s { font-size: 0.82rem; color: var(--muted); margin-top: 0.25rem; }
    .flag {
      width: 100%;
      max-width: 280px;
      border-radius: 10px;
      border: 1px solid var(--line);
      display: block;
    }
    .skel {
      height: 1.2em;
      width: 60%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--line), transparent, var(--line));
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .banner {
      padding: 0.65rem 0.8rem;
      border-radius: 10px;
      margin-bottom: 0.85rem;
      border: 1px solid var(--line);
      font-size: 0.92rem;
    }
    .banner.err { border-color: var(--danger); color: var(--danger); }
    .disclaimer { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
    .reload { margin-bottom: 0.85rem; }

</head>

  <script>
(function () {
  var KEY = "dm-labs-theme";
  var btn = document.getElementById("theme-toggle");
  var SUN = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>';
  function isDark() { return document.documentElement.getAttribute("data-theme") === "dark"; }
  function paint() {
    if (!btn) return;
    btn.innerHTML = isDark() ? SUN : MOON;
    var en = (document.documentElement.lang || "pt") === "en";
    btn.setAttribute("aria-label", isDark() ? (en ? "Light mode" : "Modo claro") : (en ? "Dark mode" : "Modo escuro"));
  }
  window.__dmPaintTheme = paint;
  paint();
  if (btn) btn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    paint();
  });
})();

function dmGetLang() {
  try {
    var l = localStorage.getItem("dm-labs-lang");
    if (l === "en" || l === "pt") return l;
  } catch (e) {}
  return "pt";
}
function dmSetLang(l) {
  try { localStorage.setItem("dm-labs-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.querySelectorAll(".lang-toggle button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true" : "false");
  });
  var dict = (window.I18N && window.I18N[l]) || {};
  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    var k = el.getAttribute("data-i18n");
    if (dict[k] != null) el.textContent = dict[k];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
    var k = el.getAttribute("data-i18n-html");
    if (dict[k] != null) el.innerHTML = dict[k];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
    var k = el.getAttribute("data-i18n-placeholder");
    if (dict[k] != null) el.setAttribute("placeholder", dict[k]);
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
    var k = el.getAttribute("data-i18n-aria");
    if (dict[k] != null) el.setAttribute("aria-label", dict[k]);
  });
  if (window.__dmPaintTheme) window.__dmPaintTheme();
  if (window.onLangChange) window.onLangChange(l);
}
document.querySelectorAll(".lang-toggle button").forEach(function (b) {
  b.addEventListener("click", function () { dmSetLang(b.getAttribute("data-lang")); });
});

(function () {
  function t(k) {
    var l = dmGetLang();
    return (I18N[l] && I18N[l][k]) || I18N.pt[k] || k;
  }
  function locale() { return dmGetLang() === "en" ? "en-GB" : "pt-MZ"; }
  function num(n, maxFrac) {
    if (n == null || !isFinite(n)) return "—";
    return new Intl.NumberFormat(locale(), { maximumFractionDigits: maxFrac || 0 }).format(n);
  }
  function wbLatest(json) {
    var rows = null;
    if (Array.isArray(json)) rows = json[1];
    else if (json && Array.isArray(json.data)) rows = json.data;
    if (!rows || !rows.length) return null;
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (!row || row.value == null || row.value === "") continue;
      var v = Number(row.value);
      if (isFinite(v)) return { value: v, date: row.date };
    }
    return null;
  }
  function weatherText(code) {
    var map = {0:"w0",1:"w1",2:"w2",3:"w3",45:"w45",48:"w48",51:"w51",53:"w51",55:"w51",61:"w61",63:"w63",65:"w65",71:"w71",80:"w80",81:"w80",82:"w80",95:"w95",96:"w95",99:"w95"};
    return t(map[code] || "w2");
  }
  function parseRc(j) {
    if (!j) throw new Error("rc empty");
    if (j.success === false) throw new Error("rc deprecated");
    if (j.errors && j.data == null && !j.cca3 && !j.alpha3Code) throw new Error("rc deprecated");
    var row = Array.isArray(j) ? j[0] : (j.data && j.data.objects && j.data.objects[0]) || j;
    if (!row || typeof row !== "object") throw new Error("rc shape");
    var name = row.name;
    var hasName = typeof name === "string" ? name : (name && name.common);
    if (!hasName && !row.cca3 && !row.alpha3Code) throw new Error("rc shape");
    return row;
  }
  function normalizeRc(row) {
    if (!row) return null;
    var langs = {};
    if (row.languages && !Array.isArray(row.languages)) langs = row.languages;
    else if (Array.isArray(row.languages)) {
      row.languages.forEach(function (l) {
        if (!l) return;
        if (typeof l === "string") langs[l] = l;
        else langs[l.iso639_2 || l.iso639_1 || l.name] = l.name || l.nativeName || "";
      });
    }
    var curs = {};
    if (row.currencies && !Array.isArray(row.currencies)) curs = row.currencies;
    else if (Array.isArray(row.currencies)) {
      row.currencies.forEach(function (c) {
        if (!c) return;
        curs[c.code || c.name] = { name: c.name, symbol: c.symbol };
      });
    }
    var capital = row.capital;
    if (typeof capital === "string") capital = [capital];
    if (!Array.isArray(capital)) capital = [];
    var flags = row.flags || {};
    if (!flags.svg && !flags.png) {
      flags = { svg: "https://flagcdn.com/mz.svg", png: "https://flagcdn.com/w320/mz.png" };
    }
    return {
      capital: capital,
      area: row.area,
      languages: langs,
      currencies: curs,
      flags: flags
    };
  }
  function fetchJson(url, timeoutMs) {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, timeoutMs || 12000);
    var opts = { method: "GET", mode: "cors" };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).finally(function () { clearTimeout(timer); });
  }
  function corsFallbacks(url) {
    return [
      url,
      "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
      "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url)
    ];
  }
  function fetchJsonFirst(urls) {
    return urls.reduce(function (p, u) {
      return p.catch(function () { return fetchJson(u); });
    }, Promise.reject(new Error("start")));
  }
  var state = { loading: true, rc: null, pop: null, gdp: null, life: null, wx: null, errors: [] };

  function hasErr(id) { return state.errors.indexOf(id) !== -1; }

  function card(key, valueHtml, sub, extra, errId) {
    var failed = !state.loading && errId && hasErr(errId) && (valueHtml === "—" || !valueHtml);
    var subHtml = sub ? '<div class="s">' + sub + "</div>" : "";
    if (failed) subHtml += '<div class="s danger">' + t("cardFail") + "</div>";
    return '<article class="card stat"><div class="k">' + t(key) + '</div><div class="v">' +
      (state.loading ? '<div class="skel"></div>' : valueHtml) + "</div>" +
      subHtml + (extra || "") + "</article>";
  }

  function render() {
    var banners = document.getElementById("banners");
    banners.innerHTML = "";
    var nOk = [state.rc, state.pop, state.gdp, state.life, state.wx].filter(Boolean).length;
    if (state.loading) {
      banners.innerHTML = '<div class="banner">' + t("loading") + "</div>";
    } else if (state.errors.length && !nOk) {
      banners.innerHTML = '<div class="banner err">' + t("error") + "</div>";
    }
    var g = document.getElementById("grid");
    var popV = state.pop ? num(state.pop.value) : "—";
    var popS = state.pop ? t("sourceWB") + " · " + state.pop.date : t("sourceWB");
    var cap = (state.rc && state.rc.capital && state.rc.capital[0]) || "—";
    var area = state.rc && state.rc.area != null ? num(state.rc.area) + " " + t("km2") : "—";
    var langs = state.rc && state.rc.languages ? Object.values(state.rc.languages).join(", ") : "—";
    var cur = "—";
    if (state.rc && state.rc.currencies) {
      cur = Object.keys(state.rc.currencies).map(function (c) {
        var x = state.rc.currencies[c];
        return (x && x.symbol ? x.symbol + " " : "") + ((x && x.name) || c) + " (" + c + ")";

    var flag = "";
    if (state.rc && state.rc.flags && (state.rc.flags.svg || state.rc.flags.png)) {
      flag = '<img class="flag" alt="' + t("flag") + '" src="' + (state.rc.flags.svg || state.rc.flags.png) + '" />';
    }
    g.innerHTML =
      card("pop", popV, popS, "", "SP.POP.TOTL") +
      card("capital", cap, t("sourceRC") + " · " + t("languages") + ": " + langs, "", "rc") +
      card("area", area, t("sourceRC") + " · " + t("currency") + ": " + cur, "", "rc") +
      card("gdp", gdpV, gdpS, "", "NY.GDP.MKTP.CD") +
      card("life", lifeV, lifeS, "", "SP.DYN.LE00.IN") +
      card("weather", wxV, wxS, "", "wx") +
      card("flag", flag || "—", t("sourceRC"), "", "rc");
  }

  async function load() {
    state.loading = true;
    state.errors = [];
    state.rc = state.pop = state.gdp = state.life = state.wx = null;
    render();
    function fail(label) { if (state.errors.indexOf(label) === -1) state.errors.push(label); return null; }
    function wb(code) {
      var urls = [
        "https://api.worldbank.org/v2/country/MOZ/indicator/" + code + "?format=json&mrnev=1&per_page=8",
        "https://api.worldbank.org/v2/country/MOZ/indicator/" + code + "?format=json&per_page=20"
      ];
      return urls.reduce(function (p, u) {
        return p.catch(function () {
          return fetchJson(u).then(wbLatest).then(function (row) {
            if (!row) throw new Error("wb empty");
            return row;
          });
        });
      }, Promise.reject(new Error("start"))).catch(function () { return fail(code); });
    }
    function staticMoz() {
      return {
        capital: ["Maputo"],
        area: 801590,
        languages: { por: "Português" },
        currencies: { MZN: { name: "Metical moçambicano", symbol: "MT" } },
        flags: { svg: "https://flagcdn.com/mz.svg", png: "https://flagcdn.com/w320/mz.png" }
      };
    }
    function fetchRc() {
      return Promise.resolve(staticMoz());
    }
    var wxUrl = "https://api.open-meteo.com/v1/forecast?latitude=-25.97&longitude=32.57&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Africa%2FMaputo";
    const jobs = [
      fetchRc().catch(function () { return fail("rc"); }),
      wb("SP.POP.TOTL"),
      wb("NY.GDP.MKTP.CD"),
      wb("SP.DYN.LE00.IN"),
      fetchJson(wxUrl, 12000).then(function (j) {
        if (!j || !j.current) throw new Error("wx shape");
        return j;
      }).catch(function () { return fail("wx"); })
    ];
    const out = await Promise.all(jobs);
    state.rc = out[0];
    state.pop = out[1];
    state.gdp = out[2];
    state.life = out[3];
    state.wx = out[4];
    state.loading = false;
    render();
  }

  window.onLangChange = function () { render(); };
  document.getElementById("reload").addEventListener("click", load);
  load();
})();
    dmSetLang(dmGetLang());
  </script>
</body>
